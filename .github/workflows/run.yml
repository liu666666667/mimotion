name: 刷步数

on:
  schedule:
    - cron: '55 7,8,9,10,11,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Update system and install zsh
        run: |
          echo "正在探测网络并自动切换最快镜像源..."
          
          # 尝试连接阿里云，如果1秒内没响应，就放弃并使用海外官方源
          if curl -s --max-time 1 http://mirrors.aliyun.com/ubuntu/ > /dev/null; then
            echo "检测到阿里云源可用，正在切换..."
            sudo sed -i 's|http://archive.ubuntu.com|http://mirrors.aliyun.com|g' /etc/apt/sources.list
            sudo sed -i 's|http://security.ubuntu.com|http://mirrors.aliyun.com|g' /etc/apt/sources.list
          else
            echo "阿里云源连接慢/不可用，已自动切换至海外官方默认源..."
            # 默认就是官方源，这里不需要额外操作，直接执行更新即可
          fi
          
          sudo apt-get update -y
          sudo apt-get install -y --fix-missing zsh

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 开始
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master
