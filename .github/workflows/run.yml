name: 刷步数

on:
  schedule:
    - cron: '40 7,8,9,10,11,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Update system and install zsh
        run: |
          echo ">>> 正在智能探测并切换最快源..."
          
          # 准备阿里云源的配置内容
          ALI_SOURCE="deb http://mirrors.aliyun.com/ubuntu/ $(lsb_release -cs) main restricted universe multiverse
          deb http://mirrors.aliyun.com/ubuntu/ $(lsb_release -cs)-updates main restricted universe multiverse
          deb http://mirrors.aliyun.com/ubuntu/ $(lsb_release -cs)-security main restricted universe multiverse"
          
          # 准备国外官方源的配置内容
          OFFICIAL_SOURCE="deb http://archive.ubuntu.com/ubuntu/ $(lsb_release -cs) main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu/ $(lsb_release -cs)-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu/ $(lsb_release -cs)-security main restricted universe multiverse"
          
          # 1秒极速探测：能用阿里用阿里，不能用就用国外默认源
          if curl -s --max-time 1 http://mirrors.aliyun.com/ubuntu/ > /dev/null; then
            echo "检测到阿里云通畅，正在写入阿里云源..."
            echo "$ALI_SOURCE" | sudo tee /etc/apt/sources.list > /dev/null
          else
            echo "阿里云连接超时，自动回退并使用国外官方源..."
            echo "$OFFICIAL_SOURCE" | sudo tee /etc/apt/sources.list > /dev/null
          fi

          # 清理微软 Azure 干扰源，避免卡顿
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list || true
          
          # 极速更新并安装 zsh
          sudo apt-get update -y
          sudo apt-get install -y zsh

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 开始
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "persist tokens"
          git push origin master
