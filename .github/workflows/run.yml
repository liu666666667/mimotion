name: 刷步数

on:
  schedule:
    - cron: '53 7,8,9,10,11,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: 极速切源（绕过限制）
        run: |
          # 直接把源目录下的所有文件强制置空，让系统读不到任何内容
          sudo truncate -s 0 /etc/apt/sources.list.d/ubuntu.sources
          sudo truncate -s 0 /etc/apt/sources.list
          
          # 写入纯净的阿里云源
          sudo sh -c 'echo "deb http://mirrors.aliyun.com/ubuntu/ noble main restricted universe multiverse" >> /etc/apt/sources.list'
          sudo sh -c 'echo "deb http://mirrors.aliyun.com/ubuntu/ noble-updates main restricted universe multiverse" >> /etc/apt/sources.list'
          sudo sh -c 'echo "deb http://mirrors.aliyun.com/ubuntu/ noble-security main restricted universe multiverse" >> /etc/apt/sources.list'
          
          # 极速更新
          sudo apt-get update -y

      - name: 初始化 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖并执行脚本
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "persist tokens triggered by ${{ github.event_name }}" || echo "No changes to commit"
          git push origin master || echo "Push skipped"
