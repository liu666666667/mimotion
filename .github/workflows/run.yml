name: 刷步数

on:
  schedule:
    - cron: '55 7,8,9,10,11,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: 安全切换为阿里云源
        run: |
          echo ">>> 正在安全替换系统源..."
          
          # 1. 把默认源文件里的 ubuntu 官方域名统一替换成阿里云
          sudo sed -i "s/archive.ubuntu.com/mirrors.aliyun.com/g" /etc/apt/sources.list
          sudo sed -i "s/security.ubuntu.com/mirrors.aliyun.com/g" /etc/apt/sources.list
          
          # 2. 尝试屏蔽第三方干扰源（加了 || true，如果删不掉也不报错，直接跳过）
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list || true

          # 3. 极速更新
          sudo apt-get update -y

      - name: 初始化Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: 开始执行脚本
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          echo ">>> 正在极速安装项目依赖..."
          pip3 install -r requirements.txt
          echo ">>> 开始执行主程序..."
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "persist tokens triggered by ${{ github.event_name }}"
          git push origin master
