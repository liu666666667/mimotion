name: 刷步数

on:
  schedule:
    - cron: '55 7,8,9,10,11,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README

      - name: Update system and install zsh
        run: |
          # 定义一个尝试换源的函数
          try_mirror() {
            echo "正在尝试切换镜像源: $1"
            sudo sed -i "s|http://archive.ubuntu.com/ubuntu|$1|g" /etc/apt/sources.list
            sudo sed -i "s|http://security.ubuntu.com|$1|g" /etc/apt/sources.list
            sudo apt-get update -y
          }

          # 按顺序尝试以下4个源，直到成功为止
          try_mirror "http://mirrors.aliyun.com/ubuntu" || \
          try_mirror "http://mirrors.cloud.tencent.com/ubuntu" || \
          try_mirror "http://repo.huaweicloud.com/ubuntu" || \
          {
            echo "所有国内源均失败，正在自动切换至美国官方源..."
            try_mirror "http://archive.ubuntu.com/ubuntu"
          }

          # 最后加上 --fix-missing 终极保底安装 zsh
          sudo apt-get install -y --fix-missing zsh

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 开始
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master
