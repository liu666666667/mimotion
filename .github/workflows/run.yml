name: 刷步数

on:
  schedule:
    - cron: '55 7,8,9,10,11,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout codes
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT }}

      - name: 强制切换阿里云源并更新
        run: |
          # 彻底清空系统默认源，杜绝它连不上官方源的隐患
          echo "deb http://mirrors.aliyun.com/ubuntu/ noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb http://mirrors.aliyun.com/ubuntu/ noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb http://mirrors.aliyun.com/ubuntu/ noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -y

      - name: 初始化Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: 安装依赖并执行脚本
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "persist tokens triggered by ${{ github.event_name }}" || echo "No changes to commit"
          git push origin master || echo "Push skipped"
