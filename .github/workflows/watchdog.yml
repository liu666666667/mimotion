name: Mimotion Watchdog
on:
  schedule:
    - cron: "0 14 * * *"   # 北京时间 22:00，UTC 14:00
  workflow_dispatch:

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check today's window success
        id: check
        env:
          GH_TOKEN: ${{ secrets.WATCHDOG_PAT_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          # 从 run.yml 读取 cron，取小时字段的最小值作为窗口起点（UTC）
          CONTENT=$(gh api "repos/${{ github.repository }}/contents/.github/workflows/run.yml" --jq '.content' | base64 -d)
          HOURS=$(echo "$CONTENT" \
            | grep -E '^[[:space:]]*-[[:space:]]*cron:' \
            | sed -E "s/.*cron:[[:space:]]*['\"]?([^'\"]*)['\"]?.*/\1/" \
            | awk '{print $2}')

          MIN_HOUR=99
          for h in $(echo "$HOURS" | tr ',' ' '); do
            if [[ "$h" == *-* ]]; then
              start=${h%-*}
              [[ "$start" =~ ^[0-9]+$ ]] && [ "$start" -lt "$MIN_HOUR" ] && MIN_HOUR=$start
            elif [[ "$h" =~ ^[0-9]+$ ]]; then
              [ "$h" -lt "$MIN_HOUR" ] && MIN_HOUR=$h
            fi
          done

          if [ "$MIN_HOUR" -eq 99 ]; then
            echo "无法解析 run.yml 的 cron 小时字段，回退到 07"
            MIN_HOUR=7
          fi

          WINDOW_START="${TODAY}T$(printf '%02d' "$MIN_HOUR"):00:00Z"
          echo "窗口起点（UTC）: $WINDOW_START"

          COUNT=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow run.yml \
            --limit 50 \
            --json createdAt,conclusion \
            --jq "[.[] | select(.createdAt >= \"$WINDOW_START\" and .conclusion == \"success\")] | length")
          echo "window_success=$COUNT" >> "$GITHUB_OUTPUT"
          echo "今天窗口内 run.yml 成功运行次数: $COUNT"

      - name: Trigger run.yml if missing
        id: trigger
        if: steps.check.outputs.window_success == '0'
        env:
          GH_TOKEN: ${{ secrets.WATCHDOG_PAT_TOKEN }}
        run: |
          echo "检测到今天窗口内没有成功运行，触发主工作流..."
          gh workflow run run.yml --repo ${{ github.repository }}
          sleep 15
          RUN_ID=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow run.yml \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "补跑 Run ID: $RUN_ID"

      - name: Wait for retry to finish
        id: wait
        if: steps.check.outputs.window_success == '0'
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.WATCHDOG_PAT_TOKEN }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          echo "等待补跑完成..."
          gh run watch "$RUN_ID" --repo ${{ github.repository }} --exit-status || true
          CONCLUSION=$(gh run view "$RUN_ID" --repo ${{ github.repository }} --json conclusion --jq '.conclusion')
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "补跑结论: $CONCLUSION"

      - name: Notify WeCom if retry failed
        if: steps.check.outputs.window_success == '0' && steps.wait.outputs.conclusion != 'success'
        env:
          WECOM_WEBHOOK: ${{ secrets.WATCHDOG_WECOM_WEBHOOK }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          curl -sS -X POST "$WECOM_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"text\",
              \"text\": {
                \"content\": \"❌ Mimotion 今天窗口内未成功执行，已自动补跑，但补跑失败。\\nRun ID: ${RUN_ID}\\n请查看：https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}\"
              }
            }"

      - name: Notify WeCom if wait timeout
        if: failure() && steps.check.outputs.window_success == '0'
        env:
          WECOM_WEBHOOK: ${{ secrets.WATCHDOG_WECOM_WEBHOOK }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          curl -sS -X POST "$WECOM_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"text\",
              \"text\": {
                \"content\": \"⏰ Mimotion 补跑等待超时（60 分钟）仍未完成，请手动检查。\\nRun ID: ${RUN_ID:-未知}\\n请查看：https://github.com/${{ github.repository }}/actions\"
              }
            }"
